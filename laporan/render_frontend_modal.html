<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .browser-window {
    width: 1040px;
    background: #f8fafc;
    border-radius: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 1px solid #cbd5e1;
    position: relative;
  }
  .browser-bar {
    background: #1e293b;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .browser-dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red { background: #ef4444; }
  .dot-yellow { background: #f59e0b; }
  .dot-green { background: #10b981; }
  .browser-url {
    flex: 1;
    background: #334155;
    color: #f1f5f9;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-family: monospace;
  }

  .modal-overlay {
    background: rgba(15, 23, 42, 0.6);
    min-height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .modal-dialog {
    width: 520px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    overflow: hidden;
    border: 1px solid #cbd5e1;
  }
  .modal-header {
    background: #f8fafc;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
  }
  .modal-title { font-size: 1.15rem; font-weight: 700; color: #0f172a; }
  .modal-body { padding: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 5px; }
  .form-control {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .form-row { display: flex; gap: 12px; }
  .col-half { flex: 1; }
  .modal-footer {
    background: #f8fafc;
    padding: 14px 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid #e2e8f0;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    border: none;
  }
  .btn-sec { background: #e2e8f0; color: #334155; }
  .btn-pri { background: #2563eb; color: #fff; }
</style>
</head>
<body>

<div class="browser-window">
  <div class="browser-bar">
    <div class="browser-dots">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="browser-url">
      🔒 http://localhost:5173/ (Modal Tambah Produk)
    </div>
  </div>

  <div class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Tambah Produk Baru</h3>
        <span style="font-size: 1.3rem; color: #94a3b8; cursor: pointer;">&times;</span>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Nama Produk <span style="color:#ef4444;">*</span></label>
          <input class="form-control" value="Laptop Asus Zenbook 14 OLED" readonly>
        </div>

        <div class="form-row">
          <div class="form-group col-half">
            <label class="form-label">Kategori <span style="color:#ef4444;">*</span></label>
            <input class="form-control" value="Laptop" readonly>
          </div>
          <div class="form-group col-half">
            <label class="form-label">Stok (Unit) <span style="color:#ef4444;">*</span></label>
            <input class="form-control" value="10" readonly>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Harga Satuan (Rp) <span style="color:#ef4444;">*</span></label>
          <input class="form-control" value="18500000" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">Deskripsi Spesifikasi</label>
          <textarea class="form-control" rows="2" readonly>Laptop ultra-portable bertenaga Intel Core Ultra</textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-sec">Batal</button>
        <button class="btn btn-pri">Simpan Produk (POST via Axios)</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
