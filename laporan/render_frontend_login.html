<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .browser-window {
    width: 1040px;
    background: #f8fafc;
    border-radius: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 1px solid #cbd5e1;
  }
  .browser-bar {
    background: #1e293b;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .browser-dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red { background: #ef4444; }
  .dot-yellow { background: #f59e0b; }
  .dot-green { background: #10b981; }
  .browser-url {
    flex: 1;
    background: #334155;
    color: #f1f5f9;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-family: monospace;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* App Navbar */
  .app-nav {
    background: #1e293b;
    color: #fff;
    padding: 14px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #334155;
  }
  .nav-brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .nav-links { display: flex; gap: 14px; }
  .nav-link { color: #94a3b8; font-size: 0.9rem; text-decoration: none; padding: 6px 12px; }
  .nav-link.active { color: #fff; background: #2563eb; border-radius: 6px; }

  /* Login Section */
  .login-container {
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .login-card {
    width: 440px;
    background: #ffffff;
    border-radius: 12px;
    padding: 36px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    border: 1px solid #e2e8f0;
  }
  .brand-icon { font-size: 2.4rem; text-align: center; margin-bottom: 8px; }
  .card-title { text-align: center; font-size: 1.35rem; color: #1e293b; font-weight: 700; }
  .card-subtitle { text-align: center; font-size: 0.88rem; color: #64748b; margin-top: 4px; margin-bottom: 24px; }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .form-control {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.92rem;
    font-family: inherit;
  }
  .btn-submit {
    width: 100%;
    padding: 11px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.95rem;
    margin-top: 8px;
    cursor: pointer;
  }
  .demo-hint {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed #e2e8f0;
    text-align: center;
    font-size: 0.8rem;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="browser-window">
  <div class="browser-bar">
    <div class="browser-dots">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="browser-url">
      <span>🔒</span> http://localhost:5173/login
    </div>
  </div>

  <div class="app-nav">
    <div class="nav-brand">📦 Katalog Produk UTS</div>
    <div class="nav-links">
      <span class="nav-link">Tentang</span>
      <span class="nav-link active">Masuk</span>
    </div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">📦</div>
      <h2 class="card-title">Login Sistem Produk</h2>
      <p class="card-subtitle">Gunakan kredensial Anda untuk memperoleh token Sanctum</p>

      <div class="form-group">
        <label class="form-label">Alamat Email</label>
        <input class="form-control" value="hisyam@example.com" readonly>
      </div>

      <div class="form-group">
        <label class="form-label">Kata Sandi (Password)</label>
        <input class="form-control" type="password" value="password123" readonly>
      </div>

      <button class="btn-submit">Masuk (Login)</button>

      <div class="demo-hint">
        💡 <strong>Kredensial Default:</strong> hisyam@example.com / password123<br>
        <span style="color:#059669; font-weight:600;">Token Sanctum disimpan otomatis di localStorage</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
