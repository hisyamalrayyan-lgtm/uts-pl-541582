name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/uts-pl-541582-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/uts-pl-541582-frontend

jobs:
  # ============================================================
  # JOB 1: Backend Testing (Soal 3c)
  # ============================================================
  backend-test:
    name: Backend Test (PHP Artisan Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel Environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run PHP Artisan Test
        working-directory: backend
        run: php artisan test

  # ============================================================
  # JOB 2: Frontend Build (Soal 3c)
  # ============================================================
  frontend-build:
    name: Frontend Build (NPM CI & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Run Unit Tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Run Build (npm run build)
        working-directory: frontend
        run: npm run build

  # ============================================================
  # JOB 3: Continuous Deployment ke GHCR (Soal 4)
  # Hanya berjalan pada push ke branch main setelah test & build lulus.
  # Pada dev / PR / feature, job ini berhenti (skipped).
  # ============================================================
  deploy:
    name: Deploy — Build & Push to GHCR
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Login ke GHCR via GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend Docker Image memakai nomor commit (bukan latest saja)
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Docker Image memakai nomor commit (bukan latest saja)
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verifikasi rahasia tersimpan di GitHub Secrets (Soal 4b)
      - name: Verify Secrets and Deployment
        env:
          APP_KEY_SECRET: ${{ secrets.APP_KEY }}
          DB_PASSWORD_SECRET: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "=========================================="
          echo "✅ Continuous Deployment Completed"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Registry   : ${{ env.REGISTRY }}"
          echo "Images: "
          echo "  - ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "  - ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          if [ -n "$APP_KEY_SECRET" ] && [ -n "$DB_PASSWORD_SECRET" ]; then
            echo "Secrets Check: APP_KEY and DB_PASSWORD are set in GitHub Secrets."
          fi
          echo "=========================================="
